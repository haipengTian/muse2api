name: Custom image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*-custom.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-custom\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "${GITHUB_REF#refs/tags/}" == "v$version" ]]
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate (Linux amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: muse2api:candidate
          build-args: MUSE2API_IMAGE_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Python regressions in the candidate image
        shell: bash
        run: |
          docker run --rm --shm-size=2g \
            -e MUSE2API_KEY=ci-test-only -e PYTHONUTF8=1 \
            -v "$PWD/tests:/app/tests:ro" \
            --entrypoint /bin/bash muse2api:candidate -ec '
              # One Python regression executes JS via Node. Install it only in
              # this disposable test container, not in the published image.
              apt-get update
              apt-get install -y --no-install-recommends nodejs
              for test in /app/tests/test_*.py; do
                echo "=== $test ==="
                if [[ "$test" == */test_vm_wait.py ]]; then
                  python "$test" /app/engine.py --assert
                else
                  python "$test"
                fi
              done
            '
      - name: Admin error-message regression
        run: node tests/test_admin_api_error_messages.mjs
      - name: Smoke test the candidate service
        shell: bash
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name muse-smoke --shm-size=2g \
            -e MUSE2API_KEY=ci-test-only \
            -p 127.0.0.1:18610:18610 muse2api:candidate
          trap 'docker logs muse-smoke; docker rm -fv muse-smoke' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-all-errors \
            --retry-max-time 60 --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:18610/healthz | python3 -c \
            'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent --show-error http://127.0.0.1:18610/openapi.json | python3 -c \
            'import json,os,sys; assert json.load(sys.stdin)["info"]["version"] == os.environ["IMAGE_VERSION"]'
          docker exec muse-smoke python -c \
            'import app; from fastapi import HTTPException
          try:
              app._upgrade_from_github_sync()
          except HTTPException as e:
              assert e.status_code == 409
          else:
              raise AssertionError("image allowed in-place upgrade")'
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker tag muse2api:candidate "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
